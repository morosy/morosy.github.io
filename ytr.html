<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube-ReStarter</title>
    <link rel="icon" type="image/png" href="assets/icons/favicon.png" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/ytr.css" />
</head>
<body>
    <div class="container">
        <div class="content-wrapper">
            <h1 class="page-title">YouTube-ReStarter</h1>
            <div class="project-image">
                <img src="assets/works/ytr.png" alt="YouTube-ReStarter" />
            </div>

            <div class="project-description">
                <p id="description-text"></p>
            </div>

            <div class="button-group">
                <button class="action-button download-btn" id="download-open-btn">ダウンロード</button>
                <button class="action-button privacy-btn" onclick="location.href='ytr-privacy.html'">プライバシーポリシー</button>
            </div>
        </div>
        <!-- Download Modal -->
        <div class="modal-overlay" id="download-modal" aria-hidden="true">
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="download-modal-title">
                <button class="modal-close" id="download-close-btn" aria-label="閉じる">×</button>

                <div class="modal-inner">
                    <div class="modal-title" id="download-modal-title">ダウンロード</div>

                    <div class="modal-button-group">
                        <button class="modal-action-button" id="download-chrome-btn">Chromeウェブストア</button>
                        <button class="modal-action-button" id="download-github-btn">GitHub</button>
                    </div>

                    <div class="modal-note">※外部サイトへ移動します</div>
                </div>
            </div>
        </div>
        <div class="footer-buttons">
            <button class="home-button" onclick="location.href='index.html'">ホームへ戻る</button>
            <button class="back-button" onclick="location.href='works.html'">戻る</button>
        </div>
        <div class="footer">
            <p>&copy; 2025 MOROZUMI Shunsuke. All rights reserved.</p>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/ytr.js"></script>
</body>
</html>
